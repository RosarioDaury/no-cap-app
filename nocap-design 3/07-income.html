<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoCap — Income</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="device">
  <div class="statusbar"><span>9:41</span><span>●●●</span></div>
  <div class="screen" style="padding-top:8px;">
    <div class="topbar">
      <p class="topbar-title" style="font-size:19px;font-family:var(--font-display);font-weight:500;">Income</p>
      <button class="icon-btn"><i class="ti ti-plus"></i></button>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <p class="eyebrow">TOTAL THIS MONTH</p>
      <p class="num-lg">RD$78,000</p>
      <div style="display:flex;gap:18px;margin-top:8px;">
        <div><p class="eyebrow" style="margin-bottom:1px;">SPENT</p><p class="row-value">RD$43,200</p></div>
        <div><p class="eyebrow" style="margin-bottom:1px;">NET</p><p class="row-value" style="color:var(--teal-700);">RD$34,800</p></div>
      </div>
    </div>

    <p class="h-section">Sources</p>
    <div>
      <div class="row">
        <div class="row-icon" style="background:var(--teal-100);color:var(--teal-900);"><i class="ti ti-briefcase"></i></div>
        <div style="flex:1;"><p class="row-title">Salary</p><p class="row-sub">Jul 15, monthly</p></div>
        <p class="row-value">65,000</p>
      </div>
      <div class="row">
        <div class="row-icon" style="background:var(--teal-100);color:var(--teal-900);"><i class="ti ti-laptop"></i></div>
        <div style="flex:1;"><p class="row-title">Freelance design</p><p class="row-sub">Jul 22</p></div>
        <p class="row-value">10,500</p>
      </div>
      <div class="row">
        <div class="row-icon" style="background:var(--teal-100);color:var(--teal-900);"><i class="ti ti-gift"></i></div>
        <div style="flex:1;"><p class="row-title">Other</p><p class="row-sub">Jul 5</p></div>
        <p class="row-value">2,500</p>
      </div>
    </div>
    <div style="flex:1;"></div>
  </div>
</div>
</body>
</html>
