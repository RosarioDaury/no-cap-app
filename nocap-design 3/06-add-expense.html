<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoCap — Add expense</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="device">
  <div class="statusbar"><span>9:41</span><span>●●●</span></div>
  <div class="screen" style="padding-top:8px;">
    <div class="topbar">
      <button class="icon-btn"><i class="ti ti-x"></i></button>
      <p class="topbar-title">Log a spend</p>
      <div style="width:34px;"></div>
    </div>

    <div style="text-align:center;margin:14px 0 26px;">
      <p class="eyebrow">AMOUNT</p>
      <p class="h-display" style="font-size:40px;color:var(--teal-300);">RD$1,250</p>
    </div>

    <p class="h-section">Category</p>
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px;">
      <div class="chip active">Groceries</div>
      <div class="chip">Utilities</div>
      <div class="chip">Gas</div>
      <div class="chip">Fun</div>
      <div class="chip">Self-care</div>
    </div>

    <p class="h-section">Note</p>
    <input type="text" placeholder="Weekly market run" style="width:100%;margin-bottom:16px;">

    <p class="h-section">Date</p>
    <div class="card-flat" style="display:flex;align-items:center;gap:8px;height:40px;padding:0 14px;margin-bottom:24px;">
      <i class="ti ti-calendar" style="color:var(--text-muted);font-size:15px;"></i> Today, Jul 31
    </div>

    <div style="flex:1;"></div>
    <button class="btn btn-primary" style="margin-bottom:20px;">Log expense</button>
  </div>
</div>
</body>
</html>
