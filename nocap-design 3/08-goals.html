<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoCap — Goals</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="device">
  <div class="statusbar"><span>9:41</span><span>●●●</span></div>
  <div class="screen" style="padding-top:8px;">
    <div class="topbar">
      <p class="topbar-title" style="font-size:19px;font-family:var(--font-display);font-weight:500;">Goals</p>
      <button class="icon-btn"><i class="ti ti-plus"></i></button>
    </div>

    <div style="display:flex;flex-direction:column;gap:11px;flex:1;">
      <div class="card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;">
          <div class="row-icon" style="background:var(--plum-100);color:var(--plum-700);"><i class="ti ti-umbrella"></i></div>
          <div style="flex:1;">
            <p class="row-title">Emergency fund</p>
            <p class="row-sub">By Dec 2026</p>
          </div>
          <p class="row-value" style="color:var(--plum-500);">62%</p>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:62%;background:var(--plum-500);"></div></div>
        <p class="row-sub" style="margin-top:7px;">RD$62,000 of RD$100,000</p>
      </div>

      <div class="card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;">
          <div class="row-icon" style="background:var(--plum-100);color:var(--plum-700);"><i class="ti ti-credit-card"></i></div>
          <div style="flex:1;">
            <p class="row-title">Pay off credit card</p>
            <p class="row-sub">By Mar 2027</p>
          </div>
          <p class="row-value" style="color:var(--plum-500);">28%</p>
        </div>
        <div class="bar-track"><div class="bar-fill" style="width:28%;background:var(--plum-500);"></div></div>
        <p class="row-sub" style="margin-top:7px;">RD$14,000 of RD$50,000</p>
      </div>

      <div class="card-flat" style="display:flex;align-items:center;gap:9px;">
        <i class="ti ti-bulb" style="color:var(--plum-700);font-size:16px;flex-shrink:0;"></i>
        <p class="body-sm" style="color:var(--plum-700);">You're under cap by RD$23,300 — put it toward a goal?</p>
      </div>
    </div>
  </div>
  <div class="bottomnav">
    <a href="05-home-dashboard.html"><i class="ti ti-home"></i></a>
    <a href="06-add-expense.html"><i class="ti ti-plus"></i></a>
    <a href="08-goals.html" class="active"><i class="ti ti-target"></i></a>
    <a href="12-ai-insights.html"><i class="ti ti-sparkles"></i></a>
    <a href="13-settings.html"><i class="ti ti-settings"></i></a>
  </div>
</div>
</body>
</html>
