<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoCap — Settings</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="device">
  <div class="statusbar"><span>9:41</span><span>●●●</span></div>
  <div class="screen" style="padding-top:8px;">
    <p class="h-display" style="font-size:19px;margin-bottom:16px;">Settings</p>

    <p class="eyebrow">BUDGET</p>
    <div style="margin-bottom:16px;">
      <div class="row">
        <i class="ti ti-currency-dollar" style="color:var(--text-secondary);font-size:16px;"></i>
        <p class="row-title" style="flex:1;">Currency</p>
        <p class="row-sub" style="margin:0;">RD$ / USD</p>
        <i class="ti ti-chevron-right" style="color:var(--text-muted);font-size:14px;"></i>
      </div>
      <div class="row">
        <i class="ti ti-category" style="color:var(--text-secondary);font-size:16px;"></i>
        <p class="row-title" style="flex:1;">Categories & caps</p>
        <i class="ti ti-chevron-right" style="color:var(--text-muted);font-size:14px;"></i>
      </div>
      <div class="row">
        <i class="ti ti-bell" style="color:var(--text-secondary);font-size:16px;"></i>
        <p class="row-title" style="flex:1;">Cap alerts</p>
        <p class="row-sub" style="margin:0;">At 80%</p>
        <i class="ti ti-chevron-right" style="color:var(--text-muted);font-size:14px;"></i>
      </div>
    </div>

    <p class="eyebrow">AI & DATA</p>
    <div style="margin-bottom:16px;">
      <div class="row">
        <i class="ti ti-sparkles" style="color:var(--text-secondary);font-size:16px;"></i>
        <p class="row-title" style="flex:1;">Conversational AI advice</p>
        <p class="row-sub" style="margin:0;">Off</p>
        <i class="ti ti-chevron-right" style="color:var(--text-muted);font-size:14px;"></i>
      </div>
      <div class="row">
        <i class="ti ti-download" style="color:var(--text-secondary);font-size:16px;"></i>
        <p class="row-title" style="flex:1;">Export backup</p>
        <i class="ti ti-chevron-right" style="color:var(--text-muted);font-size:14px;"></i>
      </div>
      <div class="row">
        <i class="ti ti-upload" style="color:var(--text-secondary);font-size:16px;"></i>
        <p class="row-title" style="flex:1;">Import backup</p>
        <i class="ti ti-chevron-right" style="color:var(--text-muted);font-size:14px;"></i>
      </div>
    </div>

    <p class="eyebrow">APP</p>
    <div>
      <div class="row">
        <i class="ti ti-moon" style="color:var(--text-secondary);font-size:16px;"></i>
        <p class="row-title" style="flex:1;">Theme</p>
        <p class="row-sub" style="margin:0;">System</p>
        <i class="ti ti-chevron-right" style="color:var(--text-muted);font-size:14px;"></i>
      </div>
      <div class="row">
        <i class="ti ti-info-circle" style="color:var(--text-secondary);font-size:16px;"></i>
        <p class="row-title" style="flex:1;">About NoCap</p>
        <i class="ti ti-chevron-right" style="color:var(--text-muted);font-size:14px;"></i>
      </div>
    </div>
    <div style="flex:1;"></div>
  </div>
  <div class="bottomnav">
    <a href="05-home-dashboard.html"><i class="ti ti-home"></i></a>
    <a href="06-add-expense.html"><i class="ti ti-plus"></i></a>
    <a href="08-goals.html"><i class="ti ti-target"></i></a>
    <a href="12-ai-insights.html"><i class="ti ti-sparkles"></i></a>
    <a href="13-settings.html" class="active"><i class="ti ti-settings"></i></a>
  </div>
</div>
</body>
</html>
