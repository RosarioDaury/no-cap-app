<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NoCap — History</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2/dist/tabler-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="device">
  <div class="statusbar"><span>9:41</span><span>●●●</span></div>
  <div class="screen" style="padding-top:8px;">
    <p class="h-display" style="font-size:19px;margin-bottom:16px;">History</p>

    <div style="display:flex;align-items:flex-end;gap:10px;height:110px;margin-bottom:6px;padding:0 2px;">
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:100%;height:64px;background:var(--border);border-radius:5px 5px 0 0;"></div>
        <p class="row-sub">Mar</p>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:100%;height:86px;background:var(--border);border-radius:5px 5px 0 0;"></div>
        <p class="row-sub">Apr</p>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:100%;height:54px;background:var(--border);border-radius:5px 5px 0 0;"></div>
        <p class="row-sub">May</p>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:100%;height:95px;background:var(--coral-300);border-radius:5px 5px 0 0;"></div>
        <p class="row-sub">Jun</p>
      </div>
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;">
        <div style="width:100%;height:72px;background:var(--teal-700);border-radius:5px 5px 0 0;"></div>
        <p class="row-sub" style="color:var(--text-primary);font-weight:600;">Jul</p>
      </div>
    </div>
    <p class="body-sm" style="text-align:center;color:var(--text-muted);margin-bottom:18px;">Spending as % of total cap, last 5 months</p>

    <div>
      <div class="row">
        <div style="flex:1;"><p class="row-title">July 2026</p><p class="row-sub">In progress</p></div>
        <p class="row-value">43,200 / 66,500</p>
      </div>
      <div class="row">
        <div style="flex:1;"><p class="row-title">June 2026</p><p class="row-sub" style="color:var(--coral-500);">Over cap</p></div>
        <p class="row-value">69,800 / 66,500</p>
      </div>
      <div class="row">
        <div style="flex:1;"><p class="row-title">May 2026</p><p class="row-sub" style="color:var(--teal-700);">RD$18,000 saved</p></div>
        <p class="row-value">48,500 / 66,500</p>
      </div>
    </div>
  </div>
</div>
</body>
</html>
