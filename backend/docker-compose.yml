# Host 5434 → container 5432 so this does not steal a local Postgres on 5432.
services:
  postgres:
    image: postgres:16
    container_name: nocap-postgres
    environment:
      POSTGRES_USER: nocap
      POSTGRES_PASSWORD: nocap
      POSTGRES_DB: nocap
    ports:
      - "5434:5432"
    volumes:
      - nocap_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocap -d nocap"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nocap_pgdata:
